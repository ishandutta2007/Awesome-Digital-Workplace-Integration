<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      .node-pulse {
        animation: pulse 3s infinite ease-in-out;
      }
      .node-pulse-alt {
        animation: pulseAlt 4s infinite ease-in-out;
      }
      .dash-flow {
        stroke-dasharray: 6 6;
        animation: flow 20s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 6 6;
        animation: flowRev 25s linear infinite;
      }
      .floating-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes flow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes pulseAlt {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, -20px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Dynamic Floating Orbs in Background -->
  <g class="floating-orb">
    <circle cx="200" cy="100" r="160" fill="url(#orbGrad1)" filter="url(#softGlow)" />
    <circle cx="1020" cy="320" r="180" fill="url(#orbGrad2)" filter="url(#softGlow)" />
    <circle cx="880" cy="80" r="130" fill="url(#orbGrad1)" filter="url(#softGlow)" />
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Background Decorative Dynamic Network Topology Lines (Behind Content) -->
  <g opacity="0.45">
    <path class="dash-flow" d="M 50 80 Q 300 30 600 70 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="dash-flow-rev" d="M 80 360 Q 400 390 700 340 T 1120 350" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path class="dash-flow" d="M 120 180 C 280 260 400 120 600 200 C 800 280 950 140 1080 220" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.6" />
    
    <!-- Animated Network Connectors -->
    <circle cx="150" cy="80" r="3" fill="#38bdf8" />
    <circle cx="600" cy="70" r="3.5" fill="#818cf8" />
    <circle cx="1050" cy="88" r="3" fill="#c084fc" />
    <circle cx="250" cy="370" r="3" fill="#38bdf8" />
    <circle cx="850" cy="345" r="3" fill="#c084fc" />
  </g>

  <!-- Side Floating Integration Node Badges (Background/Accent Depth) -->
  <g opacity="0.65" transform="translate(40, 190)">
    <rect width="120" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">HRIS &amp; ITSM</text>
  </g>
  <g opacity="0.65" transform="translate(1040, 190)">
    <rect width="120" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" />
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">ChatOps / AI</text>
  </g>

  <!-- Foreground Content Area: Main Title, Badges, Tagline -->
  <g id="main-content">
    <!-- Top Pill / Super-header -->
    <g transform="translate(435, 62)">
      <rect width="330" height="32" rx="16" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.2" />
      <circle cx="20" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED DIGITAL WORKPLACE ECOSYSTEM</text>
    </g>

    <!-- Main Title (Crisp Foreground, High Contrast, Shadow for Readability) -->
    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Digital Workplace Integration
    </text>

    <!-- Gradient Subtitle / Category Label -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="700" fill="url(#accentGrad)" letter-spacing="0.5">
      Employee Experience Platforms • Intranets • ChatOps • Enterprise Portals
    </text>

    <!-- Descriptive Tagline -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      A comprehensive landscape of leading SaaS suites &amp; production-ready open-source alternatives
    </text>

    <!-- Capability Pills Row -->
    <g transform="translate(195, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="90" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💼 SaaS Suite Benchmarks</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="97" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔓 Self-Hosted Alternatives</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(405, 0)">
        <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="97" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Workflow Orchestration</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(615, 0)">
        <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="97" y="23" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Conversational AI &amp; Bots</text>
      </g>
    </g>

    <!-- Bottom Metrics / Key Indicators -->
    <g transform="translate(320, 345)">
      <text x="0" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⭐ STAR-SORTED REPOSITORIES</text>
      <text x="210" y="22" fill="#475569" font-size="13">•</text>
      <text x="235" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💰 TRANSPARENT PRICING</text>
      <text x="430" y="22" fill="#475569" font-size="13">•</text>
      <text x="455" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 REGULARLY UPDATED</text>
    </g>
  </g>
</svg>
